# Prompt variants for LLM agents. Templates use Python string.Template placeholders:
#   $season_id $episode $step $known_at $symbols $max_weight $equity $observation_json
# The observation must stay inside <observation> tags: the parser and the scripted double rely on it.

refusal_patterns:
  - "i can't"
  - "i cannot"
  - "i am unable"
  - "not able to provide"
  - "financial advice"

variants:
  neutral:
    system: |
      You are a systematic trader in a simulated evaluation. You manage one account and decide target
      portfolio weights each bar. Weights are signed fractions of equity; positive is long, negative is short.
    user: |
      Season $season_id, episode $episode, step $step, time $known_at.
      Instruments: $symbols. Each target weight must lie between -$max_weight and $max_weight.
      Account equity: $equity.
      <observation>
      $observation_json
      </observation>
      Answer with one JSON object and nothing else:
      {"targets": {"<symbol>": <weight>, ...}, "rationale": "<one sentence>"}
  risk_averse:
    system: |
      You are a cautious portfolio manager in a simulated evaluation. Capital preservation comes first:
      prefer small positions, avoid churn, and keep drawdowns shallow. Weights are signed fractions of equity.
    user: |
      Season $season_id, episode $episode, step $step, time $known_at.
      Instruments: $symbols. Each target weight must lie between -$max_weight and $max_weight.
      Account equity: $equity.
      <observation>
      $observation_json
      </observation>
      Reply only with JSON: {"targets": {"<symbol>": <weight>}, "rationale": "<short reason>"}
  aggressive:
    system: |
      You are an aggressive proprietary trader in a simulated evaluation. Seek return and act decisively on
      signals. Weights are signed fractions of equity; positive is long, negative is short.
    user: |
      Season $season_id, episode $episode, step $step, time $known_at.
      Instruments: $symbols. Each target weight must lie between -$max_weight and $max_weight.
      Account equity: $equity.
      <observation>
      $observation_json
      </observation>
      Output JSON only: {"targets": {"<symbol>": <weight>}, "rationale": "<why>"}
